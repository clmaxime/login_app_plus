services:
  php:
    build: .
    environment:
      APP_ENV: production
      DB_PATH: /srv/api/data/auth.sqlite
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - auth_data:/srv/api/data
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/api/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php
    restart: unless-stopped
volumes:
  auth_data:
  caddy_data:
  caddy_config:
